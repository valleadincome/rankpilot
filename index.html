<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RankPilot — Listing Health Audit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #0E1420;
    --panel: #141B2A;
    --line: #29334A;
    --paper: #EDF0F5;
    --muted: #8A93A6;
    --accent: #E8A33D;
    --positive: #4FBD8B;
    --negative: #E85D5D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 28px 20px 60px;
  }

  .shell { max-width: 1080px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--accent);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-name { font-weight: 700; font-size: 19px; letter-spacing: 0.01em; }

  .brand-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .beta-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 999px;
    letter-spacing: 0.06em;
  }

  .scanbar {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
    margin: 18px 0 26px;
    opacity: 0.55;
  }

  .scanbar-tick { background: var(--line); height: 100%; display: inline-block; }

  .scanbar.active .scanbar-tick {
    background: var(--accent);
    animation: scanpulse 1.1s ease-in-out infinite;
  }

  @keyframes scanpulse {
    0%, 100% { opacity: 0.25; transform: scaleY(0.5); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  .grid {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
    gap: 20px;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
  }

  .card-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 6px;
  }

  label:first-of-type { margin-top: 0; }

  input, textarea {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    resize: vertical;
  }

  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  textarea { min-height: 84px; line-height: 1.45; }

  .run-btn {
    margin-top: 20px;
    width: 100%;
    background: var(--accent);
    color: var(--ink);
    border: none;
    border-radius: 9px;
    padding: 13px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .run-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .run-btn:not(:disabled):hover { opacity: 0.9; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    gap: 10px;
    min-height: 320px;
  }

  .results-empty svg { color: var(--line); }

  .stage-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.03em;
  }

  .error-box {
    border: 1px solid var(--negative);
    background: rgba(232, 93, 93, 0.08);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-top: 16px;
    color: var(--paper);
  }

  .gauge-row {
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .gauge-svg { width: 170px; flex-shrink: 0; }
  .gauge-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px;
    font-weight: 600;
    fill: var(--paper);
  }
  .gauge-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.12em;
    fill: var(--muted);
  }

  .gauge-summary { font-size: 14px; line-height: 1.5; color: var(--paper); }
  .gauge-summary-comp { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 10px;
  }

  .fix-row {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .fix-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .fix-title { font-weight: 600; font-size: 14.5px; }

  .impact-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .impact-high { background: rgba(232, 163, 61, 0.15); color: var(--accent); }
  .impact-medium { background: rgba(138, 147, 166, 0.15); color: var(--muted); }
  .impact-low { background: rgba(138, 147, 166, 0.1); color: var(--muted); }

  .diff-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 5px;
    word-break: break-word;
  }

  .diff-before { background: rgba(232, 93, 93, 0.08); color: #E8A9A9; }
  .diff-after { background: rgba(79, 189, 139, 0.08); color: #A9E0C6; }

  .fix-rationale { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

  .kw-chip-row { display: flex; flex-direction: column; gap: 8px; }

  .kw-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    flex-wrap: wrap;
  }

  .kw-term {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }

  .kw-reason { color: var(--muted); }

  .footnote {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
      </div>
      <div>
        <div class="brand-name">RankPilot</div>
        <div class="brand-tag">Listing Health Audit</div>
      </div>
    </div>
    <div class="beta-pill">LIVE AI · BETA</div>
  </div>

  <div class="scanbar" id="scanbar"></div>

  <div class="grid">
    <div class="card">
      <div class="card-title">Your listing</div>

      <label for="title">Product title</label>
      <input id="title" placeholder="e.g. Stainless Steel Insulated Water Bottle, 32oz Leakproof" />

      <label for="bullets">Bullet points</label>
      <textarea id="bullets" placeholder="Paste your current bullet points, one per line"></textarea>

      <label for="category">Category</label>
      <input id="category" placeholder="e.g. Sports & Outdoors > Water Bottles" />

      <label for="keywords">Target keywords</label>
      <input id="keywords" placeholder="e.g. insulated water bottle, leakproof bottle" />

      <label for="competitors">Known competitors (optional)</label>
      <input id="competitors" placeholder="e.g. Hydro Flask, Stanley, Owala" />

      <button class="run-btn" id="runBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span id="runBtnLabel">Run listing audit</span>
      </button>

      <div class="error-box" id="errorBox" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--negative)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
        <span id="errorText"></span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Audit results</div>
      <div id="resultsArea">
        <div class="results-empty" id="emptyState">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42Z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
          <div>Enter your title and bullets, then run the audit.</div>
          <div style="font-size:12px;">RankPilot checks your listing against live category data and returns a scored, prioritized fix list.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const STAGE_LABELS = {
    research: "Scanning competitors & category data",
    structuring: "Compiling audit",
  };

  const els = {
    title: document.getElementById('title'),
    bullets: document.getElementById('bullets'),
    category: document.getElementById('category'),
    keywords: document.getElementById('keywords'),
    competitors: document.getElementById('competitors'),
    runBtn: document.getElementById('runBtn'),
    runBtnLabel: document.getElementById('runBtnLabel'),
    errorBox: document.getElementById('errorBox'),
    errorText: document.getElementById('errorText'),
    resultsArea: document.getElementById('resultsArea'),
    scanbar: document.getElementById('scanbar'),
  };

  // build the scan bar ticks once
  for (let i = 0; i < 48; i++) {
    const tick = document.createElement('span');
    tick.className = 'scanbar-tick';
    tick.style.width = i % 5 === 0 ? '2.5px' : '1px';
    tick.style.animationDelay = `${(i % 12) * 0.06}s`;
    els.scanbar.appendChild(tick);
  }

  function setLoading(isLoading, stageKey) {
    els.runBtn.disabled = isLoading || !canRun();
    els.scanbar.classList.toggle('active', isLoading);
    if (isLoading) {
      els.runBtnLabel.textContent = 'Running audit…';
      els.runBtn.querySelector('svg').outerHTML = '<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
      els.resultsArea.innerHTML = `
        <div class="results-empty">
          <svg class="spin" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          <div class="stage-note">${STAGE_LABELS[stageKey] || ''}</div>
        </div>`;
    } else {
      els.runBtnLabel.textContent = 'Run listing audit';
      els.runBtn.querySelector('svg').outerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>';
    }
  }

  function canRun() {
    return els.title.value.trim().length > 3 && els.bullets.value.trim().length > 10;
  }

  function updateButtonState() {
    els.runBtn.disabled = !canRun();
  }
  [els.title, els.bullets].forEach(el => el.addEventListener('input', updateButtonState));
  updateButtonState();

  function showError(msg) {
    els.errorText.textContent = msg;
    els.errorBox.style.display = 'flex';
  }
  function hideError() {
    els.errorBox.style.display = 'none';
  }

  async function callClaude(messages, tools) {
    const body = {
      model: "claude-sonnet-4-6",
      max_tokens: 1800,
      messages,
    };
    if (tools) body.tools = tools;
    const res = await fetch("/api/audit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    const data = await res.json();
    return (data.content || [])
      .map(block => (block.type === "text" ? block.text : ""))
      .filter(Boolean)
      .join("\n");
  }

  function scoreColor(score) {
    if (score >= 75) return "var(--positive)";
    if (score >= 50) return "var(--accent)";
    return "var(--negative)";
  }

  function impactWeight(impact) {
    if (impact === "high") return 3;
    if (impact === "medium") return 2;
    return 1;
  }

  function gaugeSVG(score) {
    const clamped = Math.max(0, Math.min(100, score || 0));
    const angle = (clamped / 100) * 180;
    const r = 84, cx = 100, cy = 100;
    const toXY = (deg) => {
      const rad = (Math.PI * deg) / 180;
      return [cx - r * Math.cos(rad), cy - r * Math.sin(rad)];
    };
    const [nx, ny] = toXY(angle);
    const largeArc = angle > 180 ? 1 : 0;

    let ticks = '';
    for (let t = 0; t <= 100; t += 10) {
      const deg = 180 - (t / 100) * 180;
      const [x1, y1] = toXY(deg);
      const rad = (Math.PI * deg) / 180;
      const x2 = cx - (r - 12) * Math.cos(rad);
      const y2 = cy - (r - 12) * Math.sin(rad);
      ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--muted)" stroke-width="1.5" opacity="0.5"/>`;
    }

    return `
      <svg viewBox="0 0 200 118" class="gauge-svg">
        <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
        <path d="M ${cx - r} ${cy} A ${r} ${r} 0 ${largeArc} 1 ${nx} ${ny}" fill="none" stroke="${scoreColor(clamped)}" stroke-width="10" stroke-linecap="round"/>
        ${ticks}
        <text x="100" y="96" text-anchor="middle" class="gauge-number">${Math.round(clamped)}</text>
        <text x="100" y="112" text-anchor="middle" class="gauge-label">HEALTH SCORE</text>
      </svg>`;
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function renderResults(result) {
    const fixes = [...(result.fixes || [])].sort(
      (a, b) => impactWeight(b.impact) - impactWeight(a.impact)
    );

    let fixesHTML = fixes.map(fix => `
      <div class="fix-row">
        <div class="fix-head">
          <div class="fix-title">${escapeHTML(fix.title)}</div>
          <span class="impact-tag impact-${escapeHTML(fix.impact)}">${escapeHTML(fix.impact)} impact</span>
        </div>
        <div class="diff-line diff-before">− ${escapeHTML(fix.before)}</div>
        <div class="diff-line diff-after">+ ${escapeHTML(fix.after)}</div>
        <div class="fix-rationale">${escapeHTML(fix.rationale)}</div>
      </div>
    `).join('');

    let kwHTML = '';
    if (result.keywordGaps && result.keywordGaps.length > 0) {
      kwHTML = `
        <div class="section-label">Keyword gaps</div>
        <div class="kw-chip-row">
          ${result.keywordGaps.map(kw => `
            <div class="kw-chip">
              <span class="kw-term">${escapeHTML(kw.keyword)}</span>
              <span class="kw-reason">${escapeHTML(kw.reason)}</span>
            </div>
          `).join('')}
        </div>`;
    }

    els.resultsArea.innerHTML = `
      <div class="gauge-row">
        ${gaugeSVG(result.healthScore)}
        <div>
          <div class="gauge-summary">${escapeHTML(result.healthSummary)}</div>
          <div class="gauge-summary-comp">${escapeHTML(result.competitiveSummary)}</div>
        </div>
      </div>
      <div class="section-label">Prioritized fixes</div>
      ${fixesHTML}
      ${kwHTML}
      <div class="footnote">
        Generated from live web research at run time. Treat fixes as testable hypotheses —
        verify impact against your own conversion data before rolling out broadly.
      </div>
    `;
  }

  function resetEmptyState() {
    els.resultsArea.innerHTML = `
      <div class="results-empty" id="emptyState">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42Z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
        <div>Enter your title and bullets, then run the audit.</div>
        <div style="font-size:12px;">RankPilot checks your listing against live category data and returns a scored, prioritized fix list.</div>
      </div>`;
  }

  async function runAudit() {
    hideError();
    if (!canRun()) return;

    setLoading(true, 'research');

    try {
      const researchPrompt = `You are RankPilot, an e-commerce listing analyst for an online seller. Analyze the listing below. Use web search to check current best practices for this product category and to see what comparable, currently-ranking listings in this category emphasize (structure, keyword placement, claims). Do not invent specific competitor names or numbers you have not found — if search results are thin, reason from general category best practices instead and say so.

LISTING
Title: ${els.title.value}
Bullet points: ${els.bullets.value}
Category: ${els.category.value || "not specified"}
Target keywords: ${els.keywords.value || "not specified"}
Named competitors to check if useful: ${els.competitors.value || "none given"}

Write an analyst report covering:
1. An overall Health Score from 0-100 for this listing, with one sentence justifying the number.
2. Three to five specific, prioritized fixes to the title or bullets. For each: what to change, what to change it to, why (the mechanism, e.g. "keyword X gets more search volume than Y and isn't currently present"), and how much impact you'd expect (high, medium, or low).
3. Three to five keyword gaps versus what similar listings in this category use.
4. One sentence summarizing the competitive position.

Be concrete and specific to this exact listing, not generic advice.`;

      const researchText = await callClaude(
        [{ role: "user", content: researchPrompt }],
        [{ type: "web_search_20250305", name: "web_search" }]
      );

      setLoading(true, 'structuring');

      const structurePrompt = `Convert the analyst report below into strict JSON only. No markdown, no code fences, no commentary before or after — the response must start with { and end with }.

Schema:
{
  "healthScore": number (0-100),
  "healthSummary": string (one sentence),
  "fixes": [
    { "title": string (short label for the fix), "before": string, "after": string, "rationale": string, "impact": "high" | "medium" | "low" }
  ],
  "keywordGaps": [
    { "keyword": string, "reason": string (short) }
  ],
  "competitiveSummary": string (one sentence)
}

Report:
${researchText}`;

      const structuredText = await callClaude([{ role: "user", content: structurePrompt }]);

      const cleaned = structuredText
        .trim()
        .replace(/^```json/i, "")
        .replace(/^```/, "")
        .replace(/```$/, "")
        .trim();

      const parsed = JSON.parse(cleaned);
      setLoading(false);
      renderResults(parsed);
    } catch (err) {
      console.error(err);
      setLoading(false);
      resetEmptyState();
      showError("The audit didn't complete. This can happen with a slow response or an unparseable result — try running it again.");
    }
  }

  els.runBtn.addEventListener('click', runAudit);
</script>

</body>
</html>
